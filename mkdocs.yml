site_name: From Digital Edition to Computational Music Analysis
site_url: https://egorpol.github.io/camat_lectures/
site_description: "Seminar materials: music encoding, Verovio and tools for analysing notated music (WS 2026/27)"
site_author: Egor Polyakov
docs_dir: docs
strict: true

hooks:
  - hooks/session_files.py

watch:
  - sessions

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/demos.css

extra_javascript:
  - path: javascripts/demos.js
    type: module

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Setup on Jupyter4NFDI: setup.md
  - Setup on your laptop: setup-laptop.md
  - Sessions:
      - "1. Why encode music?": sessions/01-why-encode-music/index.md
      - "2. The source and the notes": sessions/02-building-an-edition/index.md
      - "3. Linking and editing": sessions/03-linking-and-editing/index.md
      - "4. Publishing, first analysis": sessions/04-publishing-and-analysis/index.md
